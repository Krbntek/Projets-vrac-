<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo soirée mapping</title>
<style>
  :root{--bg:#0b0d11;--txt:#eef1f5;--dim:#9aa3ad;--acc:#ffb454;--line:#2a3138}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
            font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #view{position:absolute;inset:0}
  #view canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;
       background:linear-gradient(transparent,rgba(5,7,10,.88) 40%);pointer-events:none}
  #hud>*{pointer-events:auto}
  #titre{font-size:26px;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 12px #000}
  #titre small{font-size:15px;font-weight:400;color:var(--acc);margin-left:10px}
  #sous{color:var(--dim);font-size:14px;margin:2px 0 10px;max-width:900px;text-shadow:0 1px 6px #000}
  #ligne{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button,select{background:#1b2027;color:var(--txt);border:1px solid var(--line);border-radius:7px;
         padding:7px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)} button.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}
  #heure{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;min-width:64px}
  input[type=range]{flex:1;min-width:220px;accent-color:var(--acc)}
  #phases{display:flex;gap:4px;margin-top:6px}
  .ph{flex:1;height:5px;border-radius:3px;background:#2a3138;position:relative}
  .ph.on{background:var(--acc)}
  .ph span{position:absolute;top:8px;left:0;font-size:10.5px;color:var(--dim);white-space:nowrap}
  #stats{position:absolute;top:14px;right:16px;background:rgba(5,7,10,.72);border:1px solid var(--line);
         border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.7;min-width:270px;backdrop-filter:blur(6px)}
  #stats b{color:var(--acc);font-variant-numeric:tabular-nums}
  #stats .et{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#555}
  #stats .et.on{background:#3fb950;box-shadow:0 0 6px #3fb950}
  #stats .sep{border-top:1px solid var(--line);margin:5px 0 3px}
  #logo{position:absolute;top:14px;left:16px;font-size:12px;color:var(--dim);background:rgba(5,7,10,.6);
        padding:6px 10px;border-radius:8px}
  #rec{display:none;position:absolute;top:58px;left:16px;color:#f85149;font-weight:700;font-size:13px}
  #rec::before{content:"●";margin-right:6px;animation:cl 1s infinite}
  @keyframes cl{50%{opacity:.2}}
  .note{font-size:11px;color:var(--dim)}
  #legpan{display:none;position:absolute;top:58px;left:16px;width:460px;max-height:calc(100% - 230px);overflow:auto;background:rgba(5,7,10,.9);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.45;backdrop-filter:blur(6px)}
  #legpan h3{margin:8px 0 4px;font-size:13px;color:var(--acc)} #legpan ul{margin:0 0 6px 16px;padding:0} #legpan li{margin:2px 0}
  #legpan table{border-collapse:collapse;font-size:11.5px;margin:3px 0 6px} #legpan td,#legpan th{border-bottom:1px solid var(--line);padding:2px 6px;text-align:left} #legpan th{color:var(--dim);font-weight:600}
  #legpan .num{display:inline-block;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#1a1200;font-weight:700;text-align:center;line-height:22px;margin-right:6px}
  #legpan .ok{color:#3fb950} #legpan .q{color:#f0883e}
  @media(max-width:700px){#stats{display:none} #titre{font-size:18px}}
</style>
</head>
<body>
<div id="view"></div>
<div id="logo">Démo d'implantation · maquette de travail, volumes voisins indicatifs</div>
<div id="rec">ENREGISTREMENT</div>
<div id="legpan"></div>
<div id="stats"></div>
<div id="hud">
  <div id="titre">—<small id="phase"></small></div>
  <div id="sous"></div>
  <div id="ligne">
    <button id="play">▶ Lecture</button>
    <span id="heure">16:00</span>
    <input type="range" id="tl" min="16" max="26" step="0.01" value="16">
    <select id="vitesse"><option value="20">1 h = 20 s</option><option value="10" selected>1 h = 10 s</option><option value="5">1 h = 5 s</option><option value="2">1 h = 2 s</option></select>
    <select id="cam"><option value="cine">Caméra : plan-séquence</option><option value="orbite">Caméra : orbite lente</option><option value="public">Caméra : dans le public</option><option value="catwalk">Caméra : depuis le catwalk</option><option value="dj">Caméra : depuis le hayon (DJ)</option><option value="mairie">Caméra : balcon de la mairie</option><option value="libre">Caméra : libre (souris)</option></select>
    <button id="video">⏺ Enregistrer la vidéo</button>
    <button id="png">⤓ Image</button>
    <button id="leg">① Légende technique</button>
    <label class="note"><input type="file" id="imp" accept=".json" style="display:none"><button id="impb" style="padding:5px 9px">Charger une implantation JSON</button></label>
  </div>
  <div id="phases"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   DONNÉES — même schéma (version 2) que unreal/implantation.json.
   Si une implantation a été chargée dans ce navigateur, on la reprend (localStorage).
   Repère : X = axe de la façade (0 au centre, + côté cour), Y = hauteur, Z = recul depuis la façade.
   ===================================================================== */
// LÉGENDE TECHNIQUE — ce qui est dessiné et ce qu'il faut faire vérifier avant de s'engager.
// {{TOUR}}, {{JAUGES}}, {{OMBRE}}, {{ELEC}} sont remplis par le code à partir des données.
const LEGENDE = `
<div style="font-weight:700;margin-bottom:4px">Éléments techniques à vérifier</div>
<div class="note">Les repères numérotés sont posés sur la maquette. Chaque ligne = une question à poser au loueur, au monteur, au prestataire ou à la Ville.</div>
<h3><span class="num">1</span>Façade mappée</h3><ul><li>accord écrit CMN / DRAC pour projeter ; <b>aucune fixation</b> sur le monument</li><li>emprise du chantier de la tour nord sur le parvis et la travée gauche</li><li>image limitée au corps de façade, tour en wash · {{OMBRE}}</li></ul>
<h3><span class="num">2</span>Tour VP — Layher Allround 3 travées × 3,07 m, plancher à {{PLANCHER}} m</h3>{{TOUR}}
<h3><span class="num">3</span>Régie étanche 20' devant la tour, surélevée de 1,20 m</h3><ul><li>surélévation sur praticables pour voir la façade <b>par-dessus le podium</b> (sinon retour caméra en régie)</li><li>alimentation dédiée <b>63 A tri</b>, terre, différentiels, onduleur</li><li>étanchéité, clim, vitre vers la façade, porte + escalier côté tour (hors public)</li><li>sortie de câbles aux deux extrémités, vers les troncs jardin et cour</li></ul>
<h3><span class="num">4</span>Podium-catwalk 1,50 m — tête 6 × 4 m + passerelle 2,4 × 12 m</h3><ul><li>à 3 m devant la régie : les coulisses sont entre les deux, hors public</li><li>charge 500 kg/m², platelage antidérapant, jupe fermée, bandes LED de nez de scène</li><li><b>garde-corps 1,10 m</b> au fond et sur les côtés de la tête ; le catwalk est la face jouée : <b>sans garde-corps</b> → largeur 2,40 m, agents aux angles, lisses basses amovibles à valider en commission</li><li>deux escaliers latéraux 1,20 m, marches 19 cm, mains courantes doubles, nez contrastés, éclairés (un pour monter, un pour descendre)</li><li>accès PMR : plateforme élévatrice mobile ou prise de parole au pied — à trancher</li><li>un régisseur de plateau pour le micro ouvert et le défilé · jauge plateau : {{JSCENE}}</li></ul>
<h3><span class="num">5</span>Village en ligne sur les flancs — 8 tonnelles 3 × 3 face à la façade</h3><ul><li>4 par côté, de part et d'autre de la tour et de la régie ; comptoirs côté public : <b>les stands voient le show</b></li><li>Prévention et Accueil au plus près de l'axe, Poste de secours à côté</li><li>lestage 4 × 20 kg par tonnelle, toits démontés si vent fort ; 1,20 m entre tonnelles (totems dans les intervalles), 2 m avec la tour</li><li>extincteurs buvette / restauration, électricité des stands depuis le tronc latéral, éclairage de secours</li></ul>
<h3><span class="num">6</span>Sono — 4 stacks de 4 subs SACH118 + têtes</h3><ul><li>16 × SACH118 (1 × 18", 1 700 W AES, fabrication maison Sound Agency / NoName) en 4 piles de 4 : 2 piles par côté à ±17,2 et ±21 m, <b>hors du cône du VP 1</b> (une pile à ±8,5 m ombrait les portails latéraux sur 3 m)</li><li>têtes estimées : <b>8 × KAMA TP-980</b> en 2 stacks L/R posés sur les piles extérieures, <b>4 × TP-980</b> sur 2 tours de délai à 38 m, <b>4 × T24N</b> en in-fill sur les piles intérieures (le centre devant le camion est couvert par les deux systèmes visés à 10° vers l'intérieur), retours : 2 × T24N (catwalk) + 2 × EPM-8 (DJ) — à confirmer par une prédiction acoustique</li><li>2 groupes de 2 piles (3,8 m entre piles, 34 m entre jardin et cour) : allées de puissance au centre inévitables → calage par groupe, 1 sub inversé par pile (cardioïde) pour protéger la façade et les riverains</li><li>niveaux : <b>102 dB(A)</b> et 118 dB(C) sur 15 min (décret 2017), afficheur en régie ; enceintes hors cône des VP</li></ul>
<h3><span class="num">7</span>Lumières — totems intégrés au village, wash de façade, scène</h3><ul><li>4 totems 5,5 m dans les intervalles de tonnelles (2 × Starway Mode B + 2 PAR 64 LED chacun), lestés, DMX et puissance protégés</li><li>2 wash de façade devant le camion, hors cône VP, jamais vers les fenêtres riveraines</li><li>2 projecteurs sur pieds aux angles de la tête de scène, bandes LED du catwalk, console GrandMA3 Command Wing en régie</li></ul>
<h3><span class="num">8</span>Éclairage public</h3><ul><li><b>extinction par la Ville</b> de 22 h à 23 h 20, rallumage pour la sortie</li><li>qui tient l'interrupteur, et un contact pendant le show</li></ul>
<h3><span class="num">9</span>Zone public — sans barrières</h3>{{JAUGES}}<ul><li>marquage au sol et agents plutôt que vauban ; couloirs latéraux de 4 m libres (voies pompiers), accès métro / tram</li><li>tours de délai dans le public : îlots tenus par un agent chacun</li><li>plan de prévention préfecture / SSIAP / secouristes selon la jauge retenue</li></ul>
<h3><span class="num">10</span>Lasers</h3><ul><li>classe et puissance, <b>calcul NOHD</b> du prestataire, zone d'exclusion : <b>rien sous 5,5 m sur la façade</b> (camion, DJ)</li><li><b>déclaration DGAC</b> : aucun faisceau vers le ciel, cibles sur la façade seule</li><li>opérateur certifié présent sur la tour, arrêt d'urgence en régie</li></ul>
<h3><span class="num">11</span>Camion 20 m³ garé en long devant la façade — écran + DJ sur le hayon</h3><ul><li>flanc côté public = surface d'affichage (écran LED ou bâche imprimée, 4,3 × 2,2 m) ; lisible sur les 15 premiers mètres, le reste passe sur la façade</li><li>hayon déployé = plateau DJ à 0,95 m : <b>charge hayon (≈ 750 kg) → 2 personnes maxi</b>, béquilles, garde-corps amovible côté arrière, calage du camion, moteur coupé</li><li>le camion est dans le bas du cône du VP 1 : {{OMBRE}} → <b>pas de set DJ pendant le mapping</b> (silhouette sur la façade), le hayon se libère à 22 h</li><li>zone technique avant (1,7 m entre camion et public) tenue par des agents</li></ul>
<h3><span class="num">12</span>Passages de câbles</h3><ul><li>troncs jardin / cour depuis la régie : derrière la zone public, puis dans les couloirs latéraux, puis le long de la façade derrière le camion et les subs</li><li>dans les couloirs pompiers : <b>passages renforcés roulables</b> (type 5 voies) ; dans le public (vers les délais) : passages 2 voies piétons jaune / noir</li><li>régie → podium en droite ligne dans les coulisses ; régie → tour par le montant arrière</li></ul>
<h3><span class="num">13</span>Repos & stockage derrière la tour</h3><ul><li>tonnelle repos 6 × 3 (bancs, eau), tonnelle stockage 3 × 3 (flight-cases), bâche opaque côté public</li><li>hors vue, hors passage, à 1 min de la régie et du plateau ; jauge repos : {{JREPOS}}</li></ul>
<h3><span class="num">14</span>Électricité — armoires et bilan</h3>{{ELEC}}
<div class="note" style="margin-top:6px">Rappel : la maquette vérifie la géométrie. Elle ne remplace ni la commission de sécurité, ni les notes de calcul (vent, lestage, acoustique), ni les déclarations.</div>`;

const DEFAUT = () => ({
  version: 2,
  projet: {
    nom: "Basilique Saint-Denis — parvis",
    facade: { largeur:32.5, hauteur:37.3, profondeur:3.0,
      contour: [[-16.25,0],[-16.25,29.2],[-5.9,29.2],[0,37.3],[5.9,29.2],[5.2,29.2],[5.2,50.6],[6.1,50.6],[6.7,54.6],[10.5,60.1],[14.3,54.6],[14.9,50.6],[15.8,50.6],[15.8,29.2],[16.25,29.2],[16.25,0]],
      rosace:{x:0,y:22.5,r:3.0},
      ouvertures:[[-2.6,2.6,0,5.5],[-12.3,-6.9,0,3.3],[6.9,12.3,0,3.3],[-2.95,2.95,13.6,24],[-11.25,-7.95,12.2,23],[-7.95,-4.65,12.2,23],[7.95,11.25,12.2,23],[11.25,14.55,12.2,23],[6.3,9.5,30.1,36.3],[11.5,14.7,30.1,36.3],[6.3,9.5,37,49],[11.5,14.7,37,49]] },
    zonePublic:{x0:-26,x1:26,z0:7,z1:61,hautYeux:2.5,densite:2,densiteMax:3},
    voisins:[{nom:"bâti ouest",x0:-55,x1:-30,z0:0,z1:50,h:16},{nom:"bâti est",x0:32,x1:60,z0:0,z1:45,h:14},{nom:"fond ouest",x0:-60,x1:-40,z0:62,z1:100,h:12},{nom:"fond est",x0:40,x1:70,z0:62,z1:110,h:18}],
    nef:{x0:-16.25,x1:16.25,z0:-108,z1:-3,h:24}
  },
  // tour Layher Allround : 3 travées de 3,07 m, 1 travée de 3,07 m de profondeur, 5 niveaux de 2 m sur embase à 0,30 m
  bloc:{x:0,z:70,hauteurVP:10.8,plancher:10.3,largeurPlateforme:9.21,profondeurPlateforme:3.07,travees:3,niveaux:5,hauteurNiveau:2.0,base:0.3},
  projecteurs:[{nom:"VP1 — bas",dx:-1.3,cx:0,cy:9.7,tr:2.02,ratio:16/9,lumens:40000,puissance_w:4200},{nom:"VP2 — haut",dx:1.3,cx:0,cy:27.6,tr:2.02,ratio:16/9,lumens:40000,puissance_w:4200}],
  lasers:[{nom:"Laser 1",dx:-3.6,dy:0.6,tx:-6,ty:17,puissance:10},{nom:"Laser 2",dx:3.6,dy:0.6,tx:8,ty:20,puissance:10}],
  regie:{longueur:6.06,largeur:2.44,hauteur:2.59,ecart:1.6,position:'devant',surelevation:1.2},
  podium:{hauteur:1.5,ecartRegie:3,tete:{largeur:6,profondeur:4},catwalk:{largeur:2.4,longueur:12},escaliers:'cotes'},
  camion:{x:0,z:4.2,longueur:7.3,largeur:2.2,cabine:2.35,plancher:0.95,hauteurCaisse:2.2,hayon:1.6,ecran:true,chargeHayonKg:750},
  village:{forme:'flancs',cote:3,ecart:1.2,ecartTour:2.0,z:67.5,stands:[{nom:"Prévention",type:"prevention"},{nom:"Poste de secours",type:"secours"},{nom:"Asso 1",type:"asso"},{nom:"Asso 2",type:"asso"},{nom:"Accueil · infos",type:"accueil"},{nom:"Buvette",type:"buvette"},{nom:"Restauration",type:"buvette"},{nom:"Asso 3",type:"asso"}]},
  repos:{x:0,z:75.5,tonnelle:{largeur:6,profondeur:3},stockage:{x:0,z:79.2,largeur:3,profondeur:3},bache:{z:72.8,demiLargeur:7,hauteur:2.2}},
  sono:{z:4,stacks:[-21,-17.2,17.2,21],subsParStack:4,sub:{modele:"SACH118",l:0.6,h:0.7,p:0.75,wAES:1700},
        tetes:{modele:"KAMA TP-980",parStackExterieur:4,frontFill:2,modeleFrontFill:"T24N"},ouverture:90,portee:62,visee:10,
        delais:2,delaiX:13,delaiZ:38,delaiH:5,delaiTetes:2},
  lumieres:{totems:[{x:-10.2,z:67.5,h:5.5},{x:10.2,z:67.5,h:5.5},{x:-18.6,z:67.5,h:5.5},{x:18.6,z:67.5,h:5.5}],
            wash:[{x:-13,z:5.5,tx:-10,ty:26},{x:13,z:5.5,tx:10.5,ty:44}],
            scene:[{dx:-4.6,dz:1.0,h:3.6},{dx:4.6,dz:1.0,h:3.6}]},
  electricite:{
    armoires:[{nom:"TGBT 125 A tri",x:-6.5,z:72,l:1.2,h:1.8,p:.6},{nom:"Coffret son jardin 63 A",x:-25,z:1.6,l:.8,h:1.2,p:.4},{nom:"Coffret son cour 63 A",x:25,z:1.6,l:.8,h:1.2,p:.4},{nom:"Coffret lumière · stands 63 A",x:6.5,z:72,l:.8,h:1.2,p:.4}],
    groupe:{nom:"GE 100 kVA insonorisé (si coffret forain insuffisant)",x:-12.5,z:78,l:3.2,h:2.2,p:1.5},
    bilan:[{systeme:"Son (2 × D20K, 3 × K10, 1 × D4×3000, DSP, X32)",kw:14,depart:"63 A tri"},{systeme:"Lumière (totems, wash, scène, GrandMA3 CW)",kw:4.5,depart:"32 A tri"},{systeme:"Vidéo (2 VP 40 k lm, serveur Resolume, écran camion, 2 lasers)",kw:12.5,depart:"32 A tri"},{systeme:"Captation (3 caméras, régie vidéo, streaming)",kw:1.5,depart:"16 A mono"},{systeme:"Régie (clim, éclairage, onduleur)",kw:3,depart:"16 A tri"},{systeme:"Stands (8 × 2 kW)",kw:16,depart:"63 A tri"},{systeme:"Repos, stockage, balisage, secours",kw:2,depart:"16 A mono"}]
  }
});
let E = DEFAUT();
try { const s = JSON.parse(localStorage.getItem('implantation-3d')||'null');
  if (s && s.camion && s.version === 2){ const d = DEFAUT(); Object.keys(d).forEach(k => { if (s[k] !== undefined) E[k] = (typeof d[k] === 'object' && !Array.isArray(d[k])) ? Object.assign(d[k], s[k]) : s[k]; }); }
  else if (s) console.info('implantation locale ignorée (ancien schéma) — exporter à nouveau depuis le visualiseur'); } catch(e){}
const P = () => E.projet;
// Téléchargements. Dans l'artefact claude.ai, un lien <a download> ne fait rien : la page doit passer par la
// capacité « downloads » (confirmation du lecteur). En fichier local (Chrome, Firefox), le lien suffit.
let DL = null; try { if (window.claude && claude.use) claude.use('downloads').then(d => { DL = d; }).catch(() => {}); } catch(e){}
async function telechargerFichier(nom, data){
  if (DL){ try { await DL.save({filename:nom, data}); return true; } catch(e){ if (e && (e.code === 'declined' || e.code === 'rate_limited')) return false; console.warn('downloads', e); } }
  const blob = data instanceof Blob ? data : new Blob([data]), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 20000); return true;
}

/* =====================================================================
   LE SCÉNARIO — la soirée, heure par heure. C'est lui que la mairie regarde.
   Flags : public (fraction de la jauge), ep éclairage public, vil village, son sono, lum lumières
   d'ambiance, map mapping, las lasers, scn scène ouverte, dj DJ sur le hayon, def défilé des

   ===================================================================== */
const PHASES = [
  {t:16.0, nom:"Montage",               sous:"Tour Layher, régie, podium-catwalk, camion et village en place. Parvis fermé au public, voies pompiers libres.", public:0.00, ep:true,  vil:false, son:false, lum:false},
  {t:18.0, nom:"Ouverture du village",  sous:"Les stands ouvrent sur les flancs, face à la façade : prévention et accueil au plus près de l'axe. L'écran du camion annonce le programme.", public:0.15, ep:true, vil:true, cam:true},

  {t:19.5, nom:"DJ sur le hayon",       sous:"Le DJ ouvre depuis le hayon du camion, devant la façade. Le parvis se remplit, lumières d'ambiance sur les totems.", public:0.50, ep:true, vil:true, cam:true, son:true, lum:true, dj:true},
  {t:20.5, nom:"Défilé des luttes",     sous:"Les collectifs invités défilent sur le catwalk, banderoles en tête : chacun·e est vu·e de tout le parvis. Le DJ accompagne.", public:0.75, ep:true, vil:true, cam:true, son:true, lum:true, dj:true, def:true},

  // le public : regarde la façade pendant le show, le catwalk pendant la scène, et danse quand le DJ joue
  const versCatwalk = q => { const pz = clamp(q.z, C.z0, T.z1), d = Math.hypot(cx - q.x, pz - q.z); return d > 26 ? null : Math.atan2(cx - q.x, pz - q.z); };
  G.foule.maj(s.public, t, show ? true : (animScene > .5 ? versCatwalk : (s.dj > .5 ? (q => null) : false)), dt);
  // lumières de scène : poursuite sur le catwalk pendant les concerts, fixes sinon
  const sc = animScene > .01 ? Math.min(1, animScene) : 0, cible = (s.live > .5) ? G.live.pers[0] : (s.rap > .5 ? G.rap.pers[0] : null);
  G.sceneLum.forEach(o => { o.l.intensity = sc * nuit * 2.6 * pulse; o.f.material.opacity = sc * nuit * .15 * pulse;
    const tz = cible ? cible.z : T.z0 - 2, tx = cible ? cible.x : cx; o.l.target.position.set(tx, H + 1.2, tz); o.l.target.updateMatrixWorld();
    const A = new THREE.Vector3(o.x, o.h - .1, o.z), B = new THREE.Vector3(tx, H + .8, tz), d = B.clone().sub(A); o.f.scale.set(1, d.length() / o.f.geometry.parameters.height, 1); o.f.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); });
  G.sceneLed.forEach(b => b.material.emissiveIntensity = (sc + s.dj*.4) * (1.4 * pulse) * (.4 + .6*nuit)); G.sceneLed[0].material.emissive.copy(sc > .5 && s.rap > .5 ? teinte : new THREE.Color(0xffb454));
  G.jupes.forEach(j => j.material.emissiveIntensity = nuit * .8 * s.vil + .05);
  renderer.toneMappingExposure = lerp(1.05, .85, jour);
  // HUD
  const Z = P().zonePublic, J = G.jauges;
  const hh = Math.floor(t) % 24, mm = Math.floor((t%1)*60);
  document.getElementById('heure').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  document.getElementById('titre').firstChild.textContent = s.phase.nom; document.getElementById('phase').textContent = P().nom;
  document.getElementById('sous').textContent = s.phase.sous;
  const lmTot = E.projecteurs.reduce((a,p)=>a+p.lumens,0), W = E.bloc.z/E.projecteurs[0].tr, Hh = W/E.projecteurs[0].ratio, lux = lmTot*.7/(2*W*Hh);
  const scene_ = s.live > .5 ? 'concert live' : s.rap > .5 ? 'rap' : s.def > .5 ? 'défilé des luttes' : s.scn > .5 ? 'micro ouvert' : 'vide';
  const fmt = n => n.toLocaleString('fr-FR');
  document.getElementById('stats').innerHTML = `
    <div>Public estimé <b>${fmt(Math.round(s.public*J.j2))}</b> / ${fmt(J.j2)} (${Z.densite} pers/m²)</div>
    <div class="note">zone nette ${fmt(J.net)} m² · maxi ERP ${fmt(J.j3)} à ${Z.densiteMax} pers/m²</div>
    <div class="sep"></div>
    <div><span class="et ${s.ep>.5?'on':''}"></span>Éclairage public ${s.ep>.5?'allumé':'<b>éteint</b>'}</div>
    <div><span class="et ${s.vil>.5?'on':''}"></span>Village ${s.vil>.5?'ouvert':'fermé'}</div>
    <div><span class="et ${s.son>.5?'on':''}"></span>Sono ${s.son>.5?'en service':'coupée'} · <span class="et ${s.dj>.5?'on':''}"></span>DJ hayon</div>
    <div><span class="et ${animScene>.5?'on':''}"></span>Catwalk : ${scene_}</div>
    <div><span class="et ${s.map>.5?'on':''}"></span>Mapping ${s.map>.5?`<b>${Math.round(lux)} lux</b> · ${(lmTot/1000)}k lm`:'éteint'}</div>
    <div><span class="et ${s.las>.5?'on':''}"></span>Lasers ${s.las>.5?'sur façade seule':'éteints'}</div>
    <div class="note" style="margin-top:4px">Soleil ${so.el.toFixed(0)}° · ${so.el < -6 ? 'nuit' : so.el < 0 ? 'crépuscule' : 'jour'}</div>`;
  document.querySelectorAll('#phases .ph').forEach((el,i) => el.classList.toggle('on', PHASES[i].t <= t));
}

/* =====================================================================
   CAMÉRAS
   ===================================================================== */
const CLES = [
  {t:16.0, p:[-90,45,150], c:[0,10,50]},    // vue d'ensemble, montage
  {t:18.0, p:[30,8,92],    c:[-4,3,66]},    // les stands sur le flanc cour, face à la façade
  {t:18.6, p:[13,4.6,43],  c:[0,2.6,57]},   // la tête de scène et le catwalk, par-dessus les premiers rangs
  {t:19.5, p:[-11,6,15],   c:[2,2.2,4.6]},  // le camion et le DJ, depuis la zone technique
  {t:20.5, p:[-9,4.5,42],  c:[0,2.4,52]},   // le défilé sur le catwalk
  {t:21.3, p:[6,2.6,34],   c:[0,2.6,48]},   // le concert, dans le public
  {t:22.0, p:[-40,20,90],  c:[0,15,10]},    // extinction
  {t:22.6, p:[-18,6,46],   c:[0,18,0]},     // le mapping, de près
  {t:23.3, p:[60,30,120],  c:[0,15,30]},    // vue d'ensemble du show
  {t:24.1, p:[14,3,20],    c:[3,2,4.5]},    // DJ de clôture
  {t:24.7, p:[0,80,120],   c:[0,0,60]},     // plan de dessus pour la sortie
  {t:26.0, p:[-90,45,150], c:[0,10,50]}
];
// chaque plan est tenu jusqu'à 0,3 h avant le suivant : le mouvement de caméra dure 3 s, le plan reste lisible
const CLES2 = []; CLES.forEach((k,i) => { CLES2.push(k); const n = CLES[i+1]; if (n && n.t - k.t > .5) CLES2.push({t:n.t - .3, p:k.p, c:k.c}); });
function cameraCine(t){
  let i = 0; while (i < CLES2.length-2 && CLES2[i+1].t <= t) i++;
  const a = CLES2[i], b = CLES2[i+1], u = clamp((t-a.t)/(b.t-a.t), 0, 1), s = u*u*(3-2*u);
  camera.position.set(lerp(a.p[0],b.p[0],s), lerp(a.p[1],b.p[1],s), lerp(a.p[2],b.p[2],s));
  controls.target.set(lerp(a.c[0],b.c[0],s), lerp(a.c[1],b.c[1],s), lerp(a.c[2],b.c[2],s));
}
let modeCam = 'cine', orb = 0;
function cameraMaj(t, dt){
  const pb = G.pb, cb = camionBox();
  if (modeCam === 'cine') cameraCine(t);
  else if (modeCam === 'orbite'){ orb += dt*.06; camera.position.set(Math.sin(orb)*120, 45, 60+Math.cos(orb)*120); controls.target.set(0,12,40); }
  else if (modeCam === 'public'){ camera.position.set(Math.sin(t)*2 + 5, 1.7, 40); controls.target.set(0,15,0); }
  else if (modeCam === 'catwalk'){ camera.position.set(pb.x, pb.H + 1.7, pb.tete.z1 - .8); controls.target.set(0, 6, 0); }
  else if (modeCam === 'dj'){ camera.position.set((cb.xh0+cb.xh1)/2, cb.yp + 1.7, cb.z1 - 1); controls.target.set(0, 2, 40); }
  else if (modeCam === 'mairie'){ camera.position.set(-46, 9, 72); controls.target.set(0,12,30); }
  controls.update();
}

/* =====================================================================
   LECTURE, VIDÉO, INIT
   ===================================================================== */
let t = 16, lecture = false, dernier = performance.now(), rec = null, chunks = [], recT0 = 0;
function legendeHTML(){
  const J = G.jauges, om = ombreCamion(), fmt = n => n.toLocaleString('fr-FR'), nom = nomenclatureTour(), el = E.electricite, tot = el.bilan.reduce((a,b) => a + b.kw, 0);
  const tour = `<table><tr><th>Pièce</th><th>Réf. Layher</th><th>Qté</th><th>Note</th></tr>${nom.map(([p,r,q,n,ok]) => `<tr><td>${p}</td><td class="${ok?'ok':'q'}">${r}</td><td>${q}</td><td>${n}</td></tr>`).join('')}</table>
    <ul><li>Réf. <span class="ok">vertes</span> : citées dans les documents Layher consultés (DOC0345, FIS 64, brochure Allround NL) ; <span class="q">orange</span> : à confirmer sur le catalogue « Layher Éléments » (layher.fr) avant commande</li><li>charge : 2 VP (~95 kg), 2 lasers, 2 techniciens, bâche → classe de charge et <b>note de calcul au vent</b> du monteur, lestage ≈ 8 t à confirmer</li><li>montage et PV par une entreprise qualifiée, contrôle avant mise en service, accès par plancher à trappe et échelle à chaque niveau</li></ul>`;
  const jg = `<table><tr><th>Espace</th><th>Surface</th><th>Jauge</th></tr>
    <tr><td>Zone public (nette, hors podium et îlots de délai)</td><td>${fmt(J.net)} m²</td><td><b>${fmt(J.j2)}</b> à 2 pers/m² · ${fmt(J.j3)} maxi à 3</td></tr>
    <tr><td>Flancs devant les stands (files, circulation)</td><td>${fmt(Math.round(J.flancs))} m²</td><td>${fmt(J.jFlancs)} à 1 pers/m²</td></tr>
    <tr><td>Plateau (tête + catwalk)</td><td>${fmt(Math.round(J.scene))} m²</td><td>${J.jScene} en défilé (1,5 m²/pers), 500 kg/m²</td></tr>
    <tr><td>Coulisses (entre podium et régie)</td><td>${fmt(Math.round(J.coulisses))} m²</td><td>${J.jCoulisses} artistes et régisseurs</td></tr>
    <tr><td>Repos équipe</td><td>${J.repos} m²</td><td>${J.jRepos} assis</td></tr>
    <tr><td>Hayon (plateau DJ)</td><td>${J.hayon.toFixed(1)} m²</td><td>${J.jHayon} personnes (charge ${E.camion.chargeHayonKg} kg)</td></tr></table>`;
  const elec = `<table><tr><th>Système</th><th>Appelé</th><th>Départ</th></tr>${el.bilan.map(b => `<tr><td>${b.systeme}</td><td>${b.kw} kW</td><td>${b.depart}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>${tot} kW</b></td><td><b>TGBT 125 A tri</b> (86 kVA) ou GE 100 kVA</td></tr></table>
    <ul><li>TGBT derrière la tour (côté jardin), coffrets son aux pieds de façade, coffret lumière / stands côté cour ; différentiels 30 mA par départ, terre commune, câbles ${fmt(Math.round(G.cablesLongueur))} m de passages au sol</li><li>synoptiques complets : <code>evenement/SYNOPTIQUES.md</code></li></ul>`;
  return LEGENDE.replace('{{TOUR}}', tour).replace(/\{\{JAUGES\}\}/g, jg).replace(/\{\{OMBRE\}\}/g, `ombre du camion sur le bas de la façade : 0 → ${om.h.toFixed(1)} m sur ${(om.x1-om.x0).toFixed(1)} m de large`)
    .replace('{{ELEC}}', elec).replace('{{PLANCHER}}', E.bloc.plancher.toFixed(1)).replace('{{JSCENE}}', `${J.jScene} personnes en défilé`).replace('{{JREPOS}}', `${J.jRepos} assis`);
}
function init(){
  const vue = document.getElementById('view');
  scene = new THREE.Scene(); fog = new THREE.Fog(0x000000, 200, 520); scene.fog = fog;
  camera = new THREE.PerspectiveCamera(40, 1, .1, 1500);
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputEncoding = THREE.sRGBEncoding;
  vue.appendChild(renderer.domElement);
  hemi = new THREE.HemisphereLight(0xdfeeff, 0x6b6250, .8); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff1dc, 1.2); sun.castShadow = true; Object.assign(sun.shadow.camera, {left:-130, right:130, top:130, bottom:-130, far:700}); sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -.0005; scene.add(sun);
  construire();
  controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*.49;
  const ph = document.getElementById('phases'); PHASES.slice(0,-1).forEach(p => { const d = document.createElement('div'); d.className = 'ph'; d.innerHTML = `<span>${String(Math.floor(p.t%24)).padStart(2,'0')}h ${p.nom}</span>`; ph.appendChild(d); });
  const tl = document.getElementById('tl'), play = document.getElementById('play');
  tl.addEventListener('input', () => { t = +tl.value; });
  play.addEventListener('click', () => { lecture = !lecture; play.textContent = lecture ? '❚❚ Pause' : '▶ Lecture'; play.classList.toggle('on', lecture); if (lecture && t >= 25.99) t = 16; });
  document.getElementById('cam').addEventListener('change', e => { modeCam = e.target.value; controls.enabled = (modeCam === 'libre'); });
  controls.enabled = false;
  document.getElementById('png').addEventListener('click', () => { renderer.render(scene, camera); const nom = `demo-${document.getElementById('heure').textContent.replace(':','h')}.png`; renderer.domElement.toBlob(b => telechargerFichier(nom, b), 'image/png'); });
  document.getElementById('video').addEventListener('click', basculerVideo);
  const lp = document.getElementById('legpan'); lp.innerHTML = legendeHTML();
  document.getElementById('leg').addEventListener('click', e => { const on = lp.style.display !== 'block'; lp.style.display = on ? 'block' : 'none'; e.target.classList.toggle('on', on); G.legendes.forEach(sp => sp.visible = on); });
  document.getElementById('impb').addEventListener('click', () => document.getElementById('imp').click());
  document.getElementById('imp').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const j = JSON.parse(txt); if (!j.camion){ alert("Ancien schéma (v1) : ce fichier n'a ni podium, ni camion, ni repos. Exporte à nouveau depuis le visualiseur implantation-3d.html."); return; } j.version = 2; localStorage.setItem('implantation-3d', JSON.stringify(j)); location.reload(); } catch(err){ alert('JSON illisible'); } }); });
  redim(); window.addEventListener('resize', redim); boucle();
}
function basculerVideo(){
  const b = document.getElementById('video');
  if (rec){ rec.stop(); return; }
  if (!window.MediaRecorder || !renderer.domElement.captureStream){ alert("Ce navigateur ne sait pas enregistrer le canvas. Utilise Chrome ou Firefox, ou capture l'écran."); return; }
  const flux = renderer.domElement.captureStream(30);
  const type = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  rec = new MediaRecorder(flux, type ? {mimeType:type, videoBitsPerSecond: 8e6} : {videoBitsPerSecond: 8e6}); chunks = []; recT0 = performance.now();
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => { const mime = rec.mimeType || type, ext = mime.includes('mp4') ? 'mp4' : 'webm', blob = new Blob(chunks, {type: mime});
    rec = null; b.textContent = '⏺ Enregistrer la vidéo'; b.classList.remove('on'); document.getElementById('rec').style.display = 'none'; lecture = false; document.getElementById('play').textContent = '▶ Lecture'; document.getElementById('play').classList.remove('on');
    if (!blob.size){ alert("Aucune image n'a été capturée : ce navigateur ne sait pas enregistrer ce canvas. Essaie Chrome ou Edge sur ordinateur, ou utilise la vidéo déjà rendue dans exports/demo-soiree.mp4."); return; }
    telechargerFichier('demo-implantation.' + ext, blob).then(ok => { if (!ok) return; const r = document.getElementById('rec'); r.textContent = `Vidéo enregistrée : demo-implantation.${ext} · ${(blob.size/1e6).toFixed(1)} Mo${ext === 'mp4' ? '' : ' (WebM : VLC, Chrome, ou convertir en MP4)'}`; r.style.display = 'block'; setTimeout(() => { r.style.display = 'none'; r.textContent = 'ENREGISTREMENT'; }, 8000); }); };
  t = 16; lecture = true; document.getElementById('play').textContent = '❚❚ Pause'; document.getElementById('play').classList.add('on');
  rec.start(500); b.textContent = '■ Arrêter'; b.classList.add('on'); document.getElementById('rec').style.display = 'block';
}
function redim(){ const v = document.getElementById('view'), w = v.clientWidth, h = v.clientHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.domElement.style.width = w+'px'; renderer.domElement.style.height = h+'px'; }
function boucle(){
  requestAnimationFrame(boucle);
  const now = performance.now(), dt = Math.min(.5, (now-dernier)/1000); dernier = now;
  if (lecture){ t += dt / (+document.getElementById('vitesse').value); if (t >= 26){ t = 26; lecture = false; document.getElementById('play').textContent = '▶ Lecture'; document.getElementById('play').classList.remove('on'); if (rec) rec.stop(); } document.getElementById('tl').value = t; }
  if (rec) document.getElementById('rec').textContent = `ENREGISTREMENT · ${Math.round((now - recT0)/1000)} s`;
  appliquer(t, dt); cameraMaj(t, dt); renderer.render(scene, camera);
}
init();
</script>
