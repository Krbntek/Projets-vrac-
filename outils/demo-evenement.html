<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo soirée mapping</title>
<style>
  :root{--bg:#0b0d11;--txt:#eef1f5;--dim:#9aa3ad;--acc:#ffb454;--line:#2a3138}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
            font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #view{position:absolute;inset:0}
  #view canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;
       background:linear-gradient(transparent,rgba(5,7,10,.88) 40%);pointer-events:none}
  #hud>*{pointer-events:auto}
  #titre{font-size:26px;font-weight:700;letter-spacing:-.01em;text-shadow:0 2px 12px #000}
  #titre small{font-size:15px;font-weight:400;color:var(--acc);margin-left:10px}
  #sous{color:var(--dim);font-size:14px;margin:2px 0 10px;max-width:900px;text-shadow:0 1px 6px #000}
  #ligne{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button,select{background:#1b2027;color:var(--txt);border:1px solid var(--line);border-radius:7px;
         padding:7px 12px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--acc)} button.on{background:var(--acc);color:#1a1200;border-color:var(--acc)}
  #heure{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;min-width:64px}
  input[type=range]{flex:1;min-width:220px;accent-color:var(--acc)}
  #phases{display:flex;gap:4px;margin-top:6px}
  .ph{flex:1;height:5px;border-radius:3px;background:#2a3138;position:relative}
  .ph.on{background:var(--acc)}
  .ph span{position:absolute;top:8px;left:0;font-size:10.5px;color:var(--dim);white-space:nowrap}
  #stats{position:absolute;top:14px;right:16px;background:rgba(5,7,10,.72);border:1px solid var(--line);
         border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.75;min-width:250px;backdrop-filter:blur(6px)}
  #stats b{color:var(--acc);font-variant-numeric:tabular-nums}
  #stats .et{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#555}
  #stats .et.on{background:#3fb950;box-shadow:0 0 6px #3fb950}
  #logo{position:absolute;top:14px;left:16px;font-size:12px;color:var(--dim);background:rgba(5,7,10,.6);
        padding:6px 10px;border-radius:8px}
  #rec{display:none;position:absolute;top:58px;left:16px;color:#f85149;font-weight:700;font-size:13px}
  #rec::before{content:"●";margin-right:6px;animation:cl 1s infinite}
  @keyframes cl{50%{opacity:.2}}
  .note{font-size:11px;color:var(--dim)}
  #legpan{display:none;position:absolute;top:58px;left:16px;width:420px;max-height:calc(100% - 230px);overflow:auto;background:rgba(5,7,10,.88);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.45;backdrop-filter:blur(6px)}
  #legpan h3{margin:8px 0 4px;font-size:13px;color:var(--acc)} #legpan ul{margin:0 0 6px 16px;padding:0} #legpan li{margin:2px 0}
  #legpan .num{display:inline-block;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#1a1200;font-weight:700;text-align:center;line-height:22px;margin-right:6px}
  @media(max-width:700px){#stats{display:none} #titre{font-size:18px}}
</style>
</head>
<body>
<div id="view"></div>
<div id="logo">Démo d'implantation · maquette de travail, volumes voisins indicatifs</div>
<div id="rec">ENREGISTREMENT</div>
<div id="legpan"></div>
<div id="stats"></div>
<div id="hud">
  <div id="titre">—<small id="phase"></small></div>
  <div id="sous"></div>
  <div id="ligne">
    <button id="play">▶ Lecture</button>
    <span id="heure">16:00</span>
    <input type="range" id="tl" min="16" max="26" step="0.01" value="16">
    <select id="vitesse"><option value="20">1 h = 20 s</option><option value="10" selected>1 h = 10 s</option><option value="5">1 h = 5 s</option><option value="2">1 h = 2 s</option></select>
    <select id="cam"><option value="cine">Caméra : plan-séquence</option><option value="orbite">Caméra : orbite lente</option><option value="public">Caméra : dans le public</option><option value="mairie">Caméra : balcon de la mairie</option><option value="libre">Caméra : libre (souris)</option></select>
    <button id="video">⏺ Enregistrer la vidéo</button>
    <button id="png">⤓ Image</button>
    <button id="leg">① Légende technique</button>
    <label class="note"><input type="file" id="imp" accept=".json" style="display:none"><button id="impb" style="padding:5px 9px">Charger une implantation JSON</button></label>
  </div>
  <div id="phases"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   DONNÉES — même schéma que outils/implantation-3d.html.
   Si le visualiseur a été utilisé dans ce navigateur, on reprend SON
   implantation (localStorage). Sinon, celle-ci.
   ===================================================================== */
// LÉGENDE TECHNIQUE — ce qui est dessiné et ce qu'il faut faire vérifier avant de s'engager
const LEGENDE = `
<div style="font-weight:700;margin-bottom:4px">Éléments techniques à vérifier</div>
<div class="note">Les repères numérotés sont posés sur la maquette. Chaque ligne = une question à poser au loueur, au monteur ou à la Ville.</div>
<h3><span class="num">1</span>Façade mappée</h3><ul><li>accord écrit CMN / DRAC pour projeter ; <b>aucune fixation</b> sur le monument</li><li>emprise du chantier de la tour nord sur le parvis et la travée gauche</li><li>image limitée au corps de façade, tour en wash</li></ul>
<h3><span class="num">2</span>Tour VP — échafaudage 9 × 3 m, plancher à 10 m</h3><ul><li>charge admissible : 2 VP (~95 kg chacun) + 2 lasers + 2 techniciens + bâche</li><li>ancrage / lestage et <b>prise au vent de la bâche</b> (démontage au-delà de 50 km/h)</li><li>garde-corps, plinthes, accès par échelle à crinoline ou escalier</li><li>PV de montage et contrôle avant mise en service</li></ul>
<h3><span class="num">3</span>Régie étanche 20' devant la tour</h3><ul><li>alimentation dédiée <b>63 A tri</b>, terre, différentiels, secours (onduleur)</li><li>étanchéité, clim, vitre vers la façade, porte côté tour (hors public)</li><li>passages de câbles au sol protégés ; en <b>dehors</b> du cône des VP (ici : oui, le bas du faisceau passe à 9 m au-dessus)</li></ul>
<h3><span class="num">4</span>Podium central 1,50 m</h3><ul><li>charge 500 kg/m², platelage antidérapant, jupe fermée</li><li><b>garde-corps 1,10 m</b> sur trois côtés, lisse intermédiaire</li><li>escalier 1,20 m, marches 19 cm, <b>mains courantes des deux côtés</b>, nez de marche contrastés, éclairé</li><li>accès PMR : rampe ou pupitre au sol en alternative</li><li>un régisseur de podium pour le micro ouvert</li></ul>
<h3><span class="num">5</span>Village en rond — 8 tonnelles 3 × 3</h3><ul><li>lestage 4 × 20 kg par tonnelle, toits démontés si vent fort</li><li>dégagements de <b>4 m</b> entre tonnelles, entrée libre côté tour</li><li>extincteurs buvette / restauration, électricité des stands, éclairage de secours</li><li>poste de secours et prévention visibles dès l'entrée</li></ul>
<h3><span class="num">6</span>Sono — PA jardin / cour</h3><ul><li>niveaux : <b>102 dB(A)</b> et 118 dB(C) sur 15 min (décret 2017), afficheur de niveau en régie</li><li>mâts lestés, enceintes hors du cône des VP</li><li>horaires et information des riverains</li></ul>
<h3><span class="num">7</span>Lumières — totems et wash de façade</h3><ul><li>lestage des totems, câbles DMX et puissance protégés</li><li>wash de façade hors cône VP, pas de faisceau vers les fenêtres riveraines</li></ul>
<h3><span class="num">8</span>Éclairage public</h3><ul><li><b>extinction par la Ville</b> de 22 h à 23 h 30, rallumage pour la sortie</li><li>qui tient l'interrupteur, et un contact pendant le show</li></ul>
<h3><span class="num">9</span>Zone public — sans barrières</h3><ul><li>jauge à 2 pers/m², marquage au sol et agents plutôt que vauban</li><li>dégagements et voies pompiers libres (4 m), circulation vers métro et tram</li><li>plan de prévention préfecture / SSIAP / secouristes selon la jauge</li></ul>
<h3><span class="num">10</span>Lasers</h3><ul><li>classe et puissance, <b>calcul NOHD</b> du prestataire, zone d'exclusion</li><li><b>déclaration DGAC</b> : aucun faisceau vers le ciel, cibles sur la façade seule</li><li>opérateur certifié présent, arrêt d'urgence en régie</li></ul>
<div class="note" style="margin-top:6px">Rappel : la maquette vérifie la géométrie. Elle ne remplace ni la commission de sécurité, ni les notes de calcul, ni les déclarations.</div>`;
const DEFAUT = () => ({
  projet: {
    nom: "Basilique Saint-Denis — parvis",
    facade: { largeur:32.5, hauteur:37.3, profondeur:3.0,
      contour: [[-16.25,0],[-16.25,29.2],[-5.9,29.2],[0,37.3],[5.9,29.2],[5.2,29.2],[5.2,50.6],[6.1,50.6],[6.7,54.6],[10.5,60.1],[14.3,54.6],[14.9,50.6],[15.8,50.6],[15.8,29.2],[16.25,29.2],[16.25,0]],
      rosace:{x:0,y:22.5,r:3.0},
      ouvertures:[[-2.6,2.6,0,5.5],[-12.3,-6.9,0,3.3],[6.9,12.3,0,3.3],[-2.95,2.95,13.6,24],[-11.25,-7.95,12.2,23],[-7.95,-4.65,12.2,23],[7.95,11.25,12.2,23],[11.25,14.55,12.2,23],[6.3,9.5,30.1,36.3],[11.5,14.7,30.1,36.3],[6.3,9.5,37,49],[11.5,14.7,37,49]] },
    zonePublic:{x0:-30,x1:30,z0:6,z1:60,hautYeux:2.5,densite:2},
    voisins:[{nom:"bâti ouest",x0:-55,x1:-30,z0:0,z1:50,h:16},{nom:"bâti est",x0:32,x1:60,z0:0,z1:45,h:14},{nom:"fond ouest",x0:-60,x1:-40,z0:62,z1:100,h:12},{nom:"fond est",x0:40,x1:70,z0:62,z1:110,h:18}],
    nef:{x0:-16.25,x1:16.25,z0:-108,z1:-3,h:24}
  },
  bloc:{x:0,z:70,hauteurVP:10,largeurPlateforme:9,profondeurPlateforme:3},
  projecteurs:[{nom:"VP1 — bas",dx:-1.3,cx:0,cy:9.7,tr:2.02,ratio:16/9,lumens:40000},{nom:"VP2 — haut",dx:1.3,cx:0,cy:27.6,tr:2.02,ratio:16/9,lumens:40000}],
  lasers:[{nom:"Laser 1",dx:-3.6,dy:-1,tx:-6,ty:17,puissance:10},{nom:"Laser 2",dx:3.6,dy:-1,tx:8,ty:20,puissance:10}],
  regie:{longueur:6.06,largeur:2.44,hauteur:2.59,ecart:0.4,position:'devant'},
  podium:{largeur:6,profondeur:5,hauteur:1.5,escalier:'arriere'},
  village:{forme:'rond',rayon:11,ecartTour:3,allee:4,pas:3.6,cote:3,ecartRegie:1.5,stands:[{nom:"Prévention",type:"prevention"},{nom:"Poste de secours",type:"secours"},{nom:"Accueil · infos",type:"accueil"},{nom:"Buvette",type:"buvette"},{nom:"Restauration",type:"buvette"},{nom:"Asso 1",type:"asso"},{nom:"Asso 2",type:"asso"},{nom:"Asso 3",type:"asso"}]},
  sono:{x:19.5,z:4,hauteur:6.5,ouverture:90,portee:62,visee:10,subs:2,delais:0,delaiX:13,delaiZ:38,delaiH:5},
  lumieres:{totems:[{x:-31,z:10,h:5.5},{x:31,z:10,h:5.5},{x:-31,z:56,h:5.5},{x:31,z:56,h:5.5}],wash:[{x:-13,z:9,tx:-10,ty:26},{x:13,z:9,tx:10.5,ty:44}]}
});
let E = DEFAUT();
try { const s = JSON.parse(localStorage.getItem('implantation-3d')||'null'); if (s && s.bloc) { const d = DEFAUT(); E = Object.assign(d, s); if (!E.projet) E.projet = d.projet; if (!E.podium) E.podium = d.podium; E.regie = Object.assign(d.regie, E.regie); E.village = Object.assign(d.village, E.village); } } catch(e){}
const P = () => E.projet;

/* =====================================================================
   LE SCÉNARIO — la soirée, heure par heure. C'est lui que la mairie regarde.
   Chaque phase fixe : public (fraction de la jauge), éclairage public,
   village allumé, sono, lumières d'ambiance, mapping, lasers.
   ===================================================================== */
const PHASES = [
  {t:16.0, nom:"Montage",              sous:"Plateforme, régie et village en place. Parvis fermé au public, accès pompiers libres.",             public:0.00, ep:true,  vil:false, son:false, lum:false, map:false, las:false},
  {t:18.0, nom:"Ouverture du village", sous:"Les stands ouvrent — prévention et poste de secours en tête d'allée, à côté de la régie.",             public:0.15, ep:true,  vil:true,  son:false, lum:false, map:false, las:false, scn:false},
  {t:18.6, nom:"Scène ouverte",        sous:"Podium ouvert au centre du village : chant, slam, prises de parole des assos. On s'inscrit au stand Accueil, à deux pas. Tout le monde est invité à monter.", public:0.35, ep:true, vil:true, son:false, lum:false, map:false, las:false, scn:true},
  {t:19.5, nom:"Le parvis se remplit", sous:"Sono en fond, lumières d'ambiance. La scène ouverte tourne, le public reste dans la zone délimitée.", public:0.55, ep:true,  vil:true,  son:true,  lum:true,  map:false, las:false, scn:true},
  {t:21.0, nom:"Crépuscule",           sous:"Dernières lueurs. Éclairage public encore allumé, dernier passage sur la scène ouverte avant le show.", public:0.85, ep:true,  vil:true,  son:true,  lum:true,  map:false, las:false, scn:true},
  {t:22.0, nom:"Extinction",           sous:"La Ville éteint l'éclairage public du parvis : c'est la condition du rendu.",                           public:1.00, ep:false, vil:true,  son:true,  lum:true,  map:false, las:false},
  {t:22.1, nom:"Le mapping",           sous:"Deux zones empilées sur le corps de façade, la tour en wash. Les faisceaux passent à plus de 9 m au-dessus des têtes.",   public:1.00, ep:false, vil:true,  son:true,  lum:false, map:true,  las:false},
  {t:22.6, nom:"Les lasers",           sous:"Tracés sur la façade uniquement, jamais vers le public ni vers le ciel. Opérateur certifié en régie.",  public:1.00, ep:false, vil:true,  son:true,  lum:false, map:true,  las:true},
  {t:23.3, nom:"Fin du show",          sous:"Rallumage progressif. La scène ouverte reprend pour un second set, le village reste ouvert pour la sortie.", public:0.80, ep:true,  vil:true,  son:true,  lum:true,  map:false, las:false, scn:true},
  {t:24.3, nom:"Sortie du public",     sous:"Flux vers le métro et le tram. Poste de secours et accueil restent ouverts.",                          public:0.25, ep:true,  vil:true,  son:false, lum:true,  map:false, las:false},
  {t:25.3, nom:"Démontage",            sous:"Parvis rendu propre avant 2 h.",                                                                       public:0.00, ep:true,  vil:false, son:false, lum:false, map:false, las:false},
  {t:26.0, nom:"Fin",                  sous:"",                                                                                                      public:0.00, ep:true,  vil:false, son:false, lum:false, map:false, las:false}
];
function etatA(t){
  let i = 0; while (i < PHASES.length-2 && PHASES[i+1].t <= t) i++;
  const a = PHASES[i], b = PHASES[i+1], u = Math.min(1, Math.max(0, (t-a.t)/Math.max(.01, b.t-a.t)));
  const s = u*u*(3-2*u);                                   // le public arrive et repart progressivement sur toute la phase
  // les équipements, eux, basculent dans les 6 dernières minutes de la phase : un show ne s'éteint pas en 40 min de fondu
  const D = Math.min(.1, b.t - a.t), v = Math.min(1, Math.max(0, (t - (b.t - D)) / D)), sv = v*v*(3-2*v);
  const bl = (k) => (a[k] ? 1 : 0) * (1-sv) + (b[k] ? 1 : 0) * sv;
  return {phase:a, public:a.public*(1-s)+b.public*s, ep:bl('ep'), vil:bl('vil'), son:bl('son'), lum:bl('lum'), map:bl('map'), las:bl('las'), scn:bl('scn')};
}
// soleil : élévation et azimut approchés pour Saint-Denis fin d'été (coucher ~20h45, nuit noire ~22h15)
function soleil(t){
  const el = Math.sin((t - 6.2) / (20.8 - 6.2) * Math.PI) * 55;   // degrés, 0 à 6h20 et 20h50
  const az = (t - 13.5) / 12 * Math.PI;                              // sud à 13h30
  return {el, az};
}

/* =====================================================================
   TEXTURES PROCÉDURALES — pas de fichier externe à charger
   ===================================================================== */
function tex(w, h, fn, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; if (repeat) t.repeat.set(...repeat); t.anisotropy = 4; return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const texPierre = tex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#d8d1be'; g.fillRect(0, 0, w, h);
  // appareil : assises de ~40 px, joints décalés
  const ass = 40;
  for (let y = 0; y < h; y += ass){
    const dec = (y/ass) % 2 ? 60 : 0;
    for (let x = -120 + dec; x < w; x += 120){
      const v = 200 + rnd()*28; g.fillStyle = `rgb(${v+8},${v+2},${v-12})`; g.fillRect(x+1, y+1, 118, ass-2);
      for (let k = 0; k < 20; k++){ g.fillStyle = `rgba(90,80,60,${rnd()*.08})`; g.fillRect(x+rnd()*118, y+rnd()*ass, rnd()*8, rnd()*3); }
    }
  }
  g.fillStyle = 'rgba(70,60,45,.35)'; for (let y = 0; y < h; y += ass) g.fillRect(0, y, w, 1.5);
  const img = g.getImageData(0,0,w,h), d = img.data;
  for (let i = 0; i < d.length; i += 4){ const n = (rnd()-.5)*14; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(img,0,0);
}, [1, 1]);
const texPave = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#7f7a70'; g.fillRect(0,0,w,h);
  for (let y = 0; y < h; y += 32) for (let x = 0; x < w; x += 32){ const v = 110 + rnd()*40; g.fillStyle = `rgb(${v},${v-3},${v-10})`; g.fillRect(x+1, y+1, 30, 30); }
}, [40, 40]);
const texBati = (fenetres=true) => tex(256, 256, (g, w, h) => {
  g.fillStyle = '#b9b2a0'; g.fillRect(0,0,w,h);
  if (fenetres) for (let y = 18; y < h-10; y += 40) for (let x = 14; x < w-10; x += 34){ g.fillStyle = rnd() > .45 ? '#1b2330' : '#3a3f48'; g.fillRect(x, y, 16, 24); }
}, [3, 2]);
const texBatiNuit = tex(256, 256, (g, w, h) => {   // fenêtres allumées (carte d'émission)
  g.fillStyle = '#000'; g.fillRect(0,0,w,h);
  for (let y = 18; y < h-10; y += 40) for (let x = 14; x < w-10; x += 34){ if (rnd() > .55){ g.fillStyle = `rgb(${220+rnd()*35},${170+rnd()*40},${90+rnd()*40})`; g.fillRect(x, y, 16, 24); } }
}, [3, 2]);
const texTente = tex(128, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0,0,w,h); for (let i = 0; i < 300; i++){ g.fillStyle = `rgba(0,0,0,${rnd()*.05})`; g.fillRect(rnd()*w, rnd()*h, 3, 3); } });

// le CONTENU du mapping : une toile animée, redessinée chaque frame pendant le show
const mapC = document.createElement('canvas'); mapC.width = 512; mapC.height = 600;
const texMapping = new THREE.CanvasTexture(mapC); texMapping.minFilter = THREE.LinearFilter;
// géométrie de l'architecture en px de toile, pour que les illustrations "accrochent" la pierre
function archi(g, w, h){
  const F = P().facade, sx = w/F.largeur, sy = h/F.hauteur, X = x => w/2 + x*sx, Y = y => h - y*sy;
  const arc = (x0,x1,y0,yn) => { const r = (x1-x0)/2*sx; g.beginPath(); g.moveTo(X(x0),Y(y0)); g.lineTo(X(x0),Y(yn)); g.arc(X((x0+x1)/2), Y(yn), r, Math.PI, 0); g.lineTo(X(x1),Y(y0)); };
  return {F, sx, sy, X, Y, arc,
    portails:[[-2.6,2.6,0,5.4],[-12.3,-6.9,0,4.9],[6.9,12.3,0,4.9]], archivoltes:[[-5.35,5.35,0,5.4],[-13.35,-5.85,0,4.9],[5.85,13.35,0,4.9]],
    lancettes:[[-11.25,-7.95,12.2,21.85],[-7.95,-4.65,12.2,21.85],[7.95,11.25,12.2,21.85],[11.25,14.55,12.2,21.85]], baie:[-2.95,2.95,10.95,13.6],
    corniches:[1.4,10.6,12.2,18.8,23.1,25.9,28.4], contreforts:[-15.3,-5.65,5.65,15.3], rose:F.rosace, pignon:[[-5.9,29.2],[0,37.3],[5.9,29.2]]};
}
let toits = null;   // silhouette de ville, tirée une fois
function dessinerMapping(t, s){

    A.contreforts.forEach(x => { g.beginPath(); g.moveTo(X(x),h); g.lineTo(X(x),Y(29.2)); g.stroke(); });

    g.beginPath(); g.arc(X(A.rose.x), Y(A.rose.y), A.rose.r*sx, 0, 7); g.stroke();

    const gr = g.createLinearGradient(0,0,0,h); gr.addColorStop(0,'#04091c'); gr.addColorStop(.6,'#22163f'); gr.addColorStop(1,'#7a3418'); g.fillStyle = gr; g.fillRect(0,0,w,h);
    const rg = g.createRadialGradient(X(A.rose.x),Y(A.rose.y),A.rose.r*sx*.2, X(A.rose.x),Y(A.rose.y),A.rose.r*sx*1.9);
    rg.addColorStop(0,'rgba(255,225,150,.75)'); rg.addColorStop(.35,'rgba(255,170,80,.28)'); rg.addColorStop(1,'rgba(255,140,60,0)'); g.fillStyle = rg; g.fillRect(0,0,w,h);

    for (let i = 0; i < 26; i++){ const sp = .55 + (i%5)*.12, x = ((tt*sp*22 + i*173) % (w+120)) - 60, y = 40 + (i*97 % (h*.7)) + Math.sin(tt*1.3 + i)*14, f = Math.sin(tt*7 + i*1.7), sc = 6 + (i%4)*3;

    g.strokeStyle = '#ffe9b0'; g.lineWidth = 3; g.beginPath(); g.arc(X(A.rose.x), Y(A.rose.y), A.rose.r*sx*.9, 0, 7); g.stroke();
    for (let i = 0; i < 12; i++){ const a = i/6*Math.PI; g.beginPath(); g.moveTo(X(A.rose.x)+Math.cos(a)*A.rose.r*sx*.78, Y(A.rose.y)+Math.sin(a)*A.rose.r*sx*.78); g.lineTo(X(A.rose.x)+Math.cos(a)*A.rose.r*sx*.9, Y(A.rose.y)+Math.sin(a)*A.rose.r*sx*.9); g.stroke(); }

    g.beginPath(); g.moveTo(X(A.rose.x), Y(A.rose.y)); g.lineTo(X(A.rose.x)+Math.cos(hh)*A.rose.r*sx*.5, Y(A.rose.y)+Math.sin(hh)*A.rose.r*sx*.5); g.stroke();
    g.beginPath(); g.moveTo(X(A.rose.x), Y(A.rose.y)); g.lineTo(X(A.rose.x)+Math.cos(mm)*A.rose.r*sx*.72, Y(A.rose.y)+Math.sin(mm)*A.rose.r*sx*.72); g.stroke();
  }
  // ---- chapitre 4 · « Finale » : ondes d'or depuis la rosace, gerbes et confettis
  k = fondu(.82, 1.01);
  if (k > 0){ g.globalAlpha = k;
    g.fillStyle = '#120a1e'; g.fillRect(0,0,w,h);
    for (let i = 0; i < 6; i++){ const r = ((tt*40 + i*90) % 620); g.strokeStyle = `rgba(255,205,90,${clamp(1 - r/620, 0, 1)*.9})`; g.lineWidth = 6; g.beginPath(); g.arc(X(A.rose.x), Y(A.rose.y), r, 0, 7); g.stroke(); }
    for (let b = 0; b < 4; b++){ const ph = (tt*.5 + b*.25) % 1, cx = w*(.2 + .6*((b*37)%100)/100), cy = h*.45 - b*60, R = ph*140;
      g.strokeStyle = `rgba(${b%2?255:120},${b%2?170:220},${b%2?60:255},${(1-ph)*.9})`; g.lineWidth = 2.5;
      for (let i = 0; i < 18; i++){ const a = i/18*Math.PI*2; g.beginPath(); g.moveTo(cx+Math.cos(a)*R*.6, cy+Math.sin(a)*R*.6 + ph*ph*40); g.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R + ph*ph*60); g.stroke(); } }
    for (let i = 0; i < 160; i++){ const x = (i*137 % w), y = ((tt*35 + i*61) % (h+20)) - 20; g.fillStyle = `hsl(${(i*23)%360},90%,65%)`; g.fillRect(x, y, 4, 7); }
    g.fillStyle = 'rgba(255,241,208,.95)'; g.font = `700 ${Math.round(sy*3)}px Georgia, serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('MERCI', X(0), Y(16.5));
  }

  g.beginPath(); A.pignon.forEach(([x,y],i) => i ? g.lineTo(X(x),Y(y)) : g.moveTo(X(x),Y(y))); g.stroke();

}

function creerFoule(pts, opt){
  // Une personne = 2 jambes + torse + 2 bras + tête + cheveux, répartis dans des InstancedMesh par
  // couleur (three r128 n'a pas de couleur par instance fiable). pts : [x, z, (yaw)] ; opt.groupes :
  // les gens sont en petits groupes qui se font face ; opt.marcheurs : part des gens qui déambulent.
  const VET = [0x1f2a44,0x3a3f48,0x151515,0xa3262b,0xe7e2d8,0x2f6b4f,0xcdb996,0x3b5998], PEAU = [0xf1c9a5,0xc68e6a,0x7a4a2e], PANT = [0x1c2430,0x101010,0x5a5248], CHEV = [0x1a1210,0x5a3a22,0xc9a24a];

  const gJambe = new THREE.CylinderGeometry(.075,.085,.82,6), gBrasH = new THREE.CylinderGeometry(.045,.05,.6,6), gTete = new THREE.SphereGeometry(.12,8,6), gChev = new THREE.SphereGeometry(.128,8,6);
  const gBras = new THREE.BoxGeometry(.07,.55,.07), gTel = new THREE.PlaneGeometry(.1,.16);
  const pers = pts.map((p,i) => ({x:p[0], z:p[1], x0:p[0], z0:p[1], yaw:(p[2] !== undefined ? p[2] : rnd()*6.28), s:.9 + rnd()*.22, ph:rnd()*6.28, vet:Math.floor(rnd()*8), peau:Math.floor(rnd()*3), pant:Math.floor(rnd()*3), chev:Math.floor(rnd()*3),
    bras:rnd() < (opt.bras||0), tel:rnd() < (opt.tel||0), marche:rnd() < (opt.marcheurs||0), dir:rnd()*6.28, vit:.25 + rnd()*.35}));

  if (opt.groupes){ const centres = []; for (let i = 0; i < pers.length/4; i++){ const q = pers[Math.floor(rnd()*pers.length)]; centres.push([q.x + (rnd()-.5)*1.4, q.z + (rnd()-.5)*1.4]); }
    pers.forEach(q => { let best = null, bd = 9; centres.forEach(c => { const d = Math.hypot(c[0]-q.x, c[1]-q.z); if (d < bd){ bd = d; best = c; } });
      if (best && bd < 2.2 && !q.marche) q.yaw = Math.atan2(best[0]-q.x, best[1]-q.z) + (rnd()-.5)*.5; }); }

  const torses = VET.map(c => mk(gTorse, c, N)), brasH = VET.map(c => mk(gBrasH, c, 2*N)), jambes = PANT.map(c => mk(gJambe, c, 2*N)), tetes = PEAU.map(c => mk(gTete, c, N)), chevs = CHEV.map(c => mk(gChev, c, N));
  const bras = mk(gBras, 0x3a3f48, N), tels = new THREE.InstancedMesh(gTel, new THREE.MeshBasicMaterial({color:0xcfe8ff}), N); tels.count = 0; tels.frustumCulled = false; scene.add(tels);

    maj(frac, t, show, dt){
      const n = Math.round(clamp(frac,0,1) * pers.length), cT = [0,0,0,0,0,0,0,0], cB = [0,0,0,0,0,0,0,0], cJ = [0,0,0], cH = [0,0,0], cC = [0,0,0]; let nb = 0, nt = 0;
      const tt = t*3600;   // secondes réelles de la soirée : les gens bougent à leur rythme, pas à celui de la lecture

        dm.position.set(q.x - sy*.02, y0 + 1.6*q.s + bob, q.z - cy*.02); dm.scale.set(1,.75,1); dm.updateMatrix(); chevs[q.chev].setMatrixAt(cC[q.chev]++, dm.matrix);

    } };
}
function construireScene(){

const lerp = (a,b,u) => a+(b-a)*u, clamp = (v,a,b) => Math.min(b,Math.max(a,v));
function appliquer(t, dt){
  const s = etatA(t), so = soleil(t), F = P().facade;
  // ciel et soleil
  const jour = clamp((so.el + 6) / 18, 0, 1);               // 0 nuit, 1 plein jour (crépuscule civil ~ -6°)
  const chaud = clamp(1 - Math.abs(so.el - 2) / 10, 0, 1);  // teinte orangée autour du coucher
  const ciel = new THREE.Color().setRGB(lerp(.03, .62, jour) + chaud*.35*jour, lerp(.04, .76, jour) + chaud*.12*jour, lerp(.08, .92, jour));
  scene.background = ciel; fog.color.copy(ciel);
  const R = 300; sun.position.set(Math.sin(so.az)*R*Math.cos(so.el*Math.PI/180), Math.sin(so.el*Math.PI/180)*R, -Math.cos(so.az)*R*Math.cos(so.el*Math.PI/180));
  sun.intensity = clamp(so.el / 25, 0, 1) * 1.6; sun.color.setRGB(1, lerp(.55, .96, clamp(so.el/15,0,1)), lerp(.3, .88, clamp(so.el/15,0,1)));
  hemi.intensity = lerp(.06, .75, jour); hemi.color.copy(ciel);
  // éclairage public et fenêtres
  const nuit = 1 - jour, ep = s.ep * nuit;
  G.candelabres.forEach(c => { c.l.intensity = ep * 2.2; c.tete.material.emissiveIntensity = ep * 2.5; });
  G.voisins.forEach(v => v.material.emissiveIntensity = nuit * .9);
  G.regieFen.material.emissiveIntensity = (t > 17 && t < 25.5) ? .8 : 0;
  G.vitraux.forEach(v => v.material.emissiveIntensity = nuit * .5);
  // village, sono, totems, wash
  G.stands.forEach(st => { st.l.intensity = s.vil * nuit * 1.6; st.toit.material.emissiveIntensity = s.vil * nuit * .35; });
  G.pa.forEach(led => led.material.emissiveIntensity = s.son * 2);
  const teinte = new THREE.Color().setHSL((t*.11) % 1, .8, .6);
  G.totems.forEach(o => { o.l.intensity = s.lum * nuit * 3; o.l.color.copy(teinte); o.f.material.color.copy(teinte); o.f.material.opacity = s.lum * nuit * .14; });
  G.wash.forEach(o => { o.l.intensity = s.lum * nuit * 2.5; o.f.material.opacity = s.lum * nuit * .12; o.l.color.copy(teinte); o.f.material.color.copy(teinte); });
  // mapping
  G.vps.forEach(v => { v.cone.material.opacity = s.map * .07; v.l.intensity = s.map * .35; });
  G.image.material.opacity = s.map * .93;
  if (s.map > 0.01) dessinerMapping(t, s);
  // lasers : balayage lent, cibles maintenues sur la façade
  G.lasers.forEach((o,i) => { const a = t*2.1 + i*2, tx = clamp(o.l.tx + Math.sin(a)*5.5, -F.largeur/2+1, F.largeur/2-1), ty = clamp(o.l.ty + Math.cos(a*.7)*6, 2, F.hauteur-1);
    const A = new THREE.Vector3(...o.src), B = new THREE.Vector3(tx,ty,0), d = B.clone().sub(A), L = d.length();
    o.beam.scale.set(1, L / o.beam.geometry.parameters.height, 1); o.beam.position.copy(A).add(B).multiplyScalar(.5); o.beam.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
    o.pt.position.set(tx,ty,.1); o.beam.material.opacity = s.las * .9; o.pt.material.opacity = s.las; });
  // foules : public dans la zone, et autour de la scène ouverte
  G.foule.maj(s.public, t, s.map > .5 || s.las > .5, dt);
  G.fouleScene.maj(s.scn, t, true); G.fouleFile.maj(s.scn, t, false); G.fouleDevant.maj(s.scn * (.5 + .5*s.public), t, false, dt);
  const pulse = .75 + .25*Math.sin(t*60*2.6);
  G.sceneLum.forEach(o => { o.l.intensity = s.scn * nuit * 2.4 * pulse; o.f.material.opacity = s.scn * nuit * .16 * pulse; });
  G.sceneLed.material.emissiveIntensity = s.scn * 1.5 * pulse; G.sceneFond.material.emissiveIntensity = nuit * .9 + .1;
  // exposition : la nuit, on laisse les lumières artificielles faire le travail
  renderer.toneMappingExposure = lerp(1.05, .85, jour);
  // HUD
  const Z = P().zonePublic, capa = Math.round((Z.x1-Z.x0)*(Z.z1-Z.z0)*Z.densite);
  const hh = Math.floor(t) % 24, mm = Math.floor((t%1)*60);
  document.getElementById('heure').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  document.getElementById('titre').firstChild.textContent = s.phase.nom; document.getElementById('phase').textContent = P().nom;
  document.getElementById('sous').textContent = s.phase.sous;
  const lmTot = E.projecteurs.reduce((a,p)=>a+p.lumens,0), W = E.bloc.z/E.projecteurs[0].tr, H = W/E.projecteurs[0].ratio, lux = lmTot*.7/(2*W*H);
  document.getElementById('stats').innerHTML = `
    <div>Public estimé <b>${Math.round(s.public*capa).toLocaleString('fr-FR')}</b> / ${capa.toLocaleString('fr-FR')} (2 pers/m²)</div>
    <div><span class="et ${s.ep>.5?'on':''}"></span>Éclairage public ${s.ep>.5?'allumé':'<b>éteint</b>'}</div>
    <div><span class="et ${s.vil>.5?'on':''}"></span>Village ${s.vil>.5?'ouvert':'fermé'}</div>
    <div><span class="et ${s.son>.5?'on':''}"></span>Sono ${s.son>.5?'en service':'coupée'}</div>
    <div><span class="et ${s.map>.5?'on':''}"></span>Mapping ${s.map>.5?`<b>${Math.round(lux)} lux</b> · ${(lmTot/1000)}k lm`:'éteint'}</div>
    <div><span class="et ${s.las>.5?'on':''}"></span>Lasers ${s.las>.5?'sur façade seule':'éteints'}</div>
    <div><span class="et ${s.scn>.5?'on':''}"></span>Scène ouverte ${s.scn>.5?'micro ouvert':'fermée'}</div>
    <div class="note" style="margin-top:4px">Soleil ${so.el.toFixed(0)}° · ${so.el < -6 ? 'nuit' : so.el < 0 ? 'crépuscule' : 'jour'}</div>`;
  document.querySelectorAll('#phases .ph').forEach((el,i) => el.classList.toggle('on', PHASES[i].t <= t));
}

/* =====================================================================
   CAMÉRAS
   ===================================================================== */
// plan-séquence : clés (heure → position, cible), interpolées en douceur
const CLES = [
  {t:16.0, p:[-90,45,150], c:[0,10,50]},   // vue d'ensemble, montage
  {t:18.0, p:[-30,12,110], c:[0,2,80]},    // le village
  {t:18.6, p:[14,3.4,98],  c:[0,2.2,85.5]},  // le podium, à hauteur d'homme, en entrant dans le village
  {t:19.0, p:[-12,5.5,90], c:[0,2,85.5]},    // on tourne autour
  {t:19.5, p:[20,6,60],    c:[0,3,68]},    // la régie devant la tour
  {t:21.0, p:[0,2.2,52],   c:[0,14,0]},    // dans le public, face à la façade
  {t:22.0, p:[-40,20,90],  c:[0,15,10]},   // extinction : on voit la place s'éteindre
  {t:22.6, p:[-18,6,46],   c:[0,18,0]},    // le mapping, de près
  {t:23.3, p:[60,30,120],  c:[0,15,30]},   // vue d'ensemble du show
  {t:24.3, p:[0,80,120],   c:[0,0,60]},    // plan de dessus pour la sortie
  {t:26.0, p:[-90,45,150], c:[0,10,50]}
];
function cameraCine(t){
  let i = 0; while (i < CLES.length-2 && CLES[i+1].t <= t) i++;
  const a = CLES[i], b = CLES[i+1], u = clamp((t-a.t)/(b.t-a.t), 0, 1), s = u*u*(3-2*u);
  camera.position.set(lerp(a.p[0],b.p[0],s), lerp(a.p[1],b.p[1],s), lerp(a.p[2],b.p[2],s));
  controls.target.set(lerp(a.c[0],b.c[0],s), lerp(a.c[1],b.c[1],s), lerp(a.c[2],b.c[2],s));
}
let modeCam = 'cine', orb = 0;
function cameraMaj(t, dt){
  if (modeCam === 'cine') cameraCine(t);
  else if (modeCam === 'orbite'){ orb += dt*.06; camera.position.set(Math.sin(orb)*120, 45, 60+Math.cos(orb)*120); controls.target.set(0,12,40); }
  else if (modeCam === 'public'){ camera.position.set(Math.sin(t)*2, 1.7, 44); controls.target.set(0,15,0); }
  else if (modeCam === 'mairie'){ camera.position.set(-46, 9, 72); controls.target.set(0,12,30); }
  controls.update();
}

/* =====================================================================
   LECTURE, VIDÉO, INIT
   ===================================================================== */
let t = 16, lecture = false, dernier = performance.now(), rec = null, chunks = [];
function init(){
  const vue = document.getElementById('view');
  scene = new THREE.Scene(); fog = new THREE.Fog(0x000000, 200, 520); scene.fog = fog;
  camera = new THREE.PerspectiveCamera(40, 1, .1, 1500);
  renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputEncoding = THREE.sRGBEncoding;
  vue.appendChild(renderer.domElement);
  hemi = new THREE.HemisphereLight(0xdfeeff, 0x6b6250, .8); scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff1dc, 1.2); sun.castShadow = true; Object.assign(sun.shadow.camera, {left:-130, right:130, top:130, bottom:-130, far:700}); sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -.0005; scene.add(sun);
  construire();
  controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI*.49;
  const ph = document.getElementById('phases'); PHASES.slice(0,-1).forEach(p => { const d = document.createElement('div'); d.className = 'ph'; d.innerHTML = `<span>${String(Math.floor(p.t%24)).padStart(2,'0')}h ${p.nom}</span>`; ph.appendChild(d); });
  const tl = document.getElementById('tl'), play = document.getElementById('play');
  tl.addEventListener('input', () => { t = +tl.value; });
  play.addEventListener('click', () => { lecture = !lecture; play.textContent = lecture ? '❚❚ Pause' : '▶ Lecture'; play.classList.toggle('on', lecture); if (lecture && t >= 25.99) t = 16; });
  document.getElementById('cam').addEventListener('change', e => { modeCam = e.target.value; controls.enabled = (modeCam === 'libre'); });
  controls.enabled = false;
  document.getElementById('png').addEventListener('click', () => { renderer.render(scene, camera); const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = `demo-${document.getElementById('heure').textContent.replace(':','h')}.png`; a.click(); });
  document.getElementById('video').addEventListener('click', basculerVideo);
  const lp = document.getElementById('legpan'); lp.innerHTML = LEGENDE;
  document.getElementById('leg').addEventListener('click', e => { const on = lp.style.display !== 'block'; lp.style.display = on ? 'block' : 'none'; e.target.classList.toggle('on', on); G.legendes.forEach(sp => sp.visible = on); });
  document.getElementById('impb').addEventListener('click', () => document.getElementById('imp').click());
  document.getElementById('imp').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(txt => { try { const j = JSON.parse(txt); localStorage.setItem('implantation-3d', JSON.stringify(j)); location.reload(); } catch(err){ alert('JSON illisible'); } }); });
  redim(); window.addEventListener('resize', redim); boucle();
}
function basculerVideo(){
  const b = document.getElementById('video');
  if (rec){ rec.stop(); return; }
  if (!window.MediaRecorder || !renderer.domElement.captureStream){ alert("Ce navigateur ne sait pas enregistrer le canvas. Utilise Chrome ou Firefox, ou capture l'écran."); return; }
  const flux = renderer.domElement.captureStream(30);
  const type = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  rec = new MediaRecorder(flux, {mimeType:type, videoBitsPerSecond: 8e6}); chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => { const blob = new Blob(chunks, {type: rec.mimeType}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'demo-implantation.' + (rec.mimeType.includes('mp4') ? 'mp4' : 'webm'); a.click(); rec = null; b.textContent = '⏺ Enregistrer la vidéo'; b.classList.remove('on'); document.getElementById('rec').style.display = 'none'; lecture = false; document.getElementById('play').textContent = '▶ Lecture'; document.getElementById('play').classList.remove('on'); };
  // on lance depuis le début, en lecture, et on s'arrête tout seul à la fin
  t = 16; lecture = true; document.getElementById('play').textContent = '❚❚ Pause'; document.getElementById('play').classList.add('on');
  rec.start(500); b.textContent = '■ Arrêter'; b.classList.add('on'); document.getElementById('rec').style.display = 'block';
}
function redim(){ const v = document.getElementById('view'), w = v.clientWidth, h = v.clientHeight; renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.domElement.style.width = w+'px'; renderer.domElement.style.height = h+'px'; }
function boucle(){
  requestAnimationFrame(boucle);
  const now = performance.now(), dt = Math.min(.5, (now-dernier)/1000); dernier = now;   // plafond : pas de saut après un onglet masqué
  if (lecture){ t += dt / (+document.getElementById('vitesse').value); if (t >= 26){ t = 26; lecture = false; document.getElementById('play').textContent = '▶ Lecture'; document.getElementById('play').classList.remove('on'); if (rec) rec.stop(); } document.getElementById('tl').value = t; }
  appliquer(t, dt); cameraMaj(t, dt); renderer.render(scene, camera);
}
init();
</script>
